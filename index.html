<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<!-- DEDICA:META -->
<title>SISTEMA SOLAR DE FLORES AMARILLAS PARA MARYURI</title>
<meta name="description" content="Sé que muchos te podran dar flores amarillas pero desarrollé este sitio web solo para tí Maryuri">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<!-- DEDICA:PRELOAD -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  /* Sin esto, cualquier elemento con width/height:100% Y padding a la vez
     queda mas ancho/alto que el propio 100% (el padding se suma aparte con
     el box-sizing por defecto) - eso es lo que corria #start-screen 20px
     hacia la derecha (100% + 20px de padding a cada lado = 40px de sobra),
     desalineando el emoji y el texto de "Toca para iniciar" del centro real
     de la pantalla. */
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  #main-title{
    position:fixed;top:40px;left:0;right:0;width:100%;
    font-size:2.6em;color:#FFFACD;white-space:nowrap;
    text-shadow:0 0 10px #FFD700,0 0 18px #FFA500;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{font-size:1.55em;top:22px;white-space:normal;padding:0 10px;line-height:1.15;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(255,215,0,.75)) drop-shadow(0 0 36px rgba(255,165,0,.38)) drop-shadow(0 0 66px rgba(218,165,32,.22));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }
  #start-text{
    font-size:1.8em;color:#FFFACD;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    #start-heart,#start-text{animation:none;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<h1 id="main-title"></h1>

<div id="start-screen">
  <div id="start-heart" aria-hidden="true">🌻</div>
  <div id="start-text">Toca para iniciar mi estimada Mayu</div>
</div>

<script src="three.min.js"></script>

<!-- DEDICA:CONFIG -->
<script>
const DEFAULTS = {
  titulo: "Feliz Día de las Flores Amarillas Maryuri🌻",
  frases: [
    "🌻 Que tengas un día tranquilo y bonito", "🌼 Deseándote siempre lo mejor de corazón",
    "🌻 Un detalle sencillo y con respeto para ti", "🌼 Que nunca te falten motivos para sonreír",
    "🌻 Guardando siempre un bonito recuerdo", "🌼 Que la vida te trate bien donde estés",
    "🌻 Un amarillo que simboliza paz y luz", "🌼 Espero que alcances cada meta que te propongas",
    "🌻 Gracias por los buenos momentos compartidos", "🌼 Que encuentres calma en cada paso",
    "🌻 Pienso en ti con sincero aprecio", "🌼 Una flor sencilla para alegrar tu día",
    "🌻 Deseándote bienestar y cosas buenas", "🌼 Que todo lo bueno te encuentre y se quede",
    "🌻 Cuidando siempre el recuerdo con respeto", "🌼 Feliz 21 de septiembre, que sea un día lindo",
    "🌻 Que todo vaya marchando bien en tu camino", "🌻 Agradeciendo lo bueno del camino recorrido",
    "🌼 Que la tranquilidad te acompañe siempre", "🌻 Mucho éxito y fuerza en cada proyecto",
    "🌼 Flores amarillas para recordarte que vales mucho", "🌻 Sin presiones, solo deseándote lo mejor",
    "🌼 Que tengas paz en cada decisión", "🌻 Un saludo sincero y sin condiciones",
    "🌼 La vida sigue y te deseo lo más bonito", "🌻 Que no te falte luz ni serenidad",
    "🌼 Espero que estés bien y tranquila", "🌻 Lo vivido con aprecio siempre se agradece",
    "🌼 Que el día te regale instantes de calma", "🌻 Feliz día de las flores amarillas, Maryuri"
  ],
  fotos: ["assets/img1.png","assets/img2.png","assets/img3.png"],
  musica: "assets/musica.m4a"
};
const CONFIG=(window.DEDICA&&window.DEDICA.merge)?window.DEDICA.merge(DEFAULTS,window.DEDICA.config):DEFAULTS;
</script>

<script>
// ================= Título fijo =================
document.getElementById('main-title').textContent=CONFIG.titulo;

// ================= Escena =================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

// Fondo: negro solido + el campo de estrellas generado abajo. La textura
// de nebulosa externa que traia el archivo original apuntaba a una URL de
// GitHub que ya no existe (404 - nunca se veia, ni siquiera antes de este
// cambio) - se quita en vez de dejar una dependencia externa rota.

// Estrellas
(function makeStars(count=2000,spread=3000){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.3+Math.random()*0.7);
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3+0]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// Núcleo tipo "agujero negro" (oscuro y opaco, para que el anillo resalte por contraste)
const coreMat=new THREE.MeshPhongMaterial({color:0x030303,transparent:true,opacity:0.92,shininess:30});
const core=new THREE.Mesh(new THREE.SphereGeometry(40,64,64),coreMat);
scene.add(core);

// Recuerdos centrales: fotos y videos se muestran dentro de un círculo.
// Todos los videos se reproducen sin sonido y la secuencia vuelve a empezar.
const memoryItems=[
  {type:'image',src:'foto-01.jpg'},
  {type:'video',src:'recuerdo.mp4'},
  {type:'image',src:'foto-02.jpg'},
  {type:'image',src:'foto-03.jpg'},
  {type:'video',src:'recuerdo-02.mp4'},
  {type:'image',src:'foto-04.jpg'},
  {type:'image',src:'foto-05.jpg'},
  {type:'image',src:'foto-06.jpg'}
];
const memoryVideo=document.createElement('video');
memoryVideo.muted=true;
memoryVideo.defaultMuted=true;
memoryVideo.loop=false;
memoryVideo.playsInline=true;
memoryVideo.preload='metadata';
let memoryIndex=0,slideStartedAt=0,experienceStarted=false;
let memoryPhoto=new Image(),photoReady=false;
const memoryCanvas=document.createElement('canvas');
memoryCanvas.width=memoryCanvas.height=512;
const memoryContext=memoryCanvas.getContext('2d');
const memoryTexture=new THREE.CanvasTexture(memoryCanvas);
const memorySprite=new THREE.Sprite(new THREE.SpriteMaterial({map:memoryTexture,transparent:true,depthWrite:false,depthTest:false}));
const MEMORY_BASE_SIZE=98;
memorySprite.scale.set(MEMORY_BASE_SIZE,MEMORY_BASE_SIZE,1);
memorySprite.renderOrder=100;
scene.add(memorySprite);
function setMemory(index){
  memoryIndex=index%memoryItems.length;slideStartedAt=performance.now();
  const item=memoryItems[memoryIndex];
  if(item.type==='video'){
    memoryVideo.pause();memoryVideo.src=item.src;memoryVideo.load();
    memoryVideo.play().catch(()=>{});
  }else{
    photoReady=false;memoryPhoto=new Image();
    memoryPhoto.onload=()=>{photoReady=true;};memoryPhoto.src=item.src;
  }
}
function nextMemory(){if(experienceStarted)setMemory((memoryIndex+1)%memoryItems.length);}
memoryVideo.addEventListener('ended',nextMemory);
function updateMemory(){
  if(!experienceStarted)return;
  const item=memoryItems[memoryIndex];
  const source=item.type==='video'?memoryVideo:memoryPhoto;
  if((item.type==='video'&&memoryVideo.readyState<2)||(item.type==='image'&&!photoReady))return;
  if(item.type==='image'&&performance.now()-slideStartedAt>4500)nextMemory();
  const size=memoryCanvas.width;
  const sourceWidth=item.type==='video'?memoryVideo.videoWidth:memoryPhoto.naturalWidth;
  const sourceHeight=item.type==='video'?memoryVideo.videoHeight:memoryPhoto.naturalHeight;
  const scale=Math.max(size/sourceWidth,size/sourceHeight);
  const drawW=sourceWidth*scale,drawH=sourceHeight*scale;
  memoryContext.clearRect(0,0,size,size);
  memoryContext.save();
  memoryContext.beginPath();memoryContext.arc(size/2,size/2,size*.45,0,Math.PI*2);memoryContext.clip();
  memoryContext.drawImage(source,(size-drawW)/2,(size-drawH)/2,drawW,drawH);
  memoryContext.restore();
  memoryContext.beginPath();memoryContext.arc(size/2,size/2,size*.45,0,Math.PI*2);
  memoryContext.strokeStyle='rgba(255,218,93,.9)';memoryContext.shadowColor='#ffb000';memoryContext.shadowBlur=20;memoryContext.lineWidth=7;memoryContext.stroke();
  memoryTexture.needsUpdate=true;
}

// El título ahora vive en la cabecera fija (#main-title, ver DEDICA:CONFIG
// mas arriba) en vez de un sprite 3D en el centro - mas legible y
// consistente con el resto del catalogo.

// Glow exterior (reducido, para que el anillo se note más)
const GLOW_BASE=360;
function makeGlow(size=768,c1='255,235,130',c2='255,180,0'){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(GLOW_BASE,GLOW_BASE,1);
scene.add(glow);

// Nebulosa floral volumétrica: pétalos suaves curvados como un pequeño sol.
function flowerTexture(size=256){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');const mid=size/2;
  for(let i=0;i<12;i++){
    g.save();g.translate(mid,mid);g.rotate(i*Math.PI*2/12);
    const petal=g.createRadialGradient(0,-size*.25,size*.02,0,-size*.25,size*.23);
    petal.addColorStop(0,'#fffbd0');petal.addColorStop(.5,'#ffe24a');petal.addColorStop(1,'#e9a400');
    g.fillStyle=petal;g.beginPath();g.ellipse(0,-size*.25,size*.1,size*.29,0,0,Math.PI*2);g.fill();g.restore();
  }
  const center=g.createRadialGradient(mid-size*.04,mid-size*.04,size*.01,mid,mid,size*.17);
  center.addColorStop(0,'#ffe879');center.addColorStop(.55,'#bd6500');center.addColorStop(1,'#5c2300');
  g.fillStyle=center;g.beginPath();g.arc(mid,mid,size*.17,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(255,246,144,.85)';g.shadowColor='#ffb000';g.shadowBlur=18;g.lineWidth=4;g.beginPath();g.arc(mid,mid,size*.43,0,Math.PI*2);g.stroke();
  return new THREE.CanvasTexture(c);
}
const flowerCrown=new THREE.Group();
const flowerMap=flowerTexture();
// Un girasol delicado: los recuerdos forman su centro y estas flores
// construyen un anillo de pétalos a su alrededor.
const PETAL_COUNT=16;
for(let petal=0;petal<PETAL_COUNT;petal++){
  const angle=petal*Math.PI*2/PETAL_COUNT-Math.PI/2;
  const dirX=Math.cos(angle),dirY=Math.sin(angle);
  const sideX=-dirY,sideY=dirX;
  for(let row=0;row<5;row++){
    const distance=60+row*13;
    const width=3+Math.sin(row*Math.PI/4)*15;
    for(let column=-1;column<=1;column++){
      const offset=column*width;
      const phase=petal*16+row*3+column;
      const flower=new THREE.Sprite(new THREE.SpriteMaterial({map:flowerMap,transparent:true,depthWrite:false,depthTest:false,opacity:.48+(row%2)*.08}));
      const size=11+(row%2)*1.5+(Math.abs(column)===1?1:0);
      const petalDepth=Math.sin(petal*1.7+row)*5;
      flower.position.set(dirX*distance+sideX*offset,dirY*distance+sideY*offset,petalDepth);
      flower.scale.set(size,size,1);flower.renderOrder=8;
      flower.userData={phase,size};flowerCrown.add(flower);
    }
  }
}
scene.add(flowerCrown);

// Palabras alrededor: frases del Día de las Flores Amarillas (min 1, se repiten
// ciclicamente hasta llenar las 150 posiciones que la escena ya reserva,
// sin importar cuántas haya dejado el cliente - ver schema.json).
const frasesBase=(Array.isArray(CONFIG.frases)&&CONFIG.frases.length)?CONFIG.frases:DEFAULTS.frases;
const WORD_SLOTS=150;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>frasesBase[i%frasesBase.length]);
function makeTextTexture(text,color){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  // Antes el tamaño de fuente era fijo (60px) sin importar el largo de la
  // frase - una frase larga (con emoji, que ya de por si ocupa bastante
  // ancho) se salia del lienzo de 512px y quedaba cortada a la mitad. Ahora
  // el tamaño se reduce hasta que la frase completa entra, con un piso de
  // 24px para que no se vuelva ilegible.
  const maxWidth=c.width-48;
  let fontSize=60;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>24){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#e6b800','#ffdb58','#f0c419'];
const textGroup=new THREE.Group();scene.add(textGroup);
// Se espera a que 'Indie Flower' termine de cargar antes de dibujar las
// frases en canvas - a diferencia del texto normal del DOM (el navegador ya
// resuelve el "parpadeo" de fuente por su cuenta), un canvas dibuja con la
// fuente que este disponible EN ESE INSTANTE: sin esto, las 150 frases
// quedaban grabadas para siempre con la tipografia de respaldo (Arial) si
// la fuente todavia no habia terminado de bajar en el momento exacto en que
// corria este bucle.
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    const sp=new THREE.Sprite(mat);
    sp.scale.set(68,21.8,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Fotos del cliente flotando de forma individual (reemplazan a los emojis de
// la version original). Minimo 1, maximo 3 (plantilla gratuita, ver
// schema.json) - se reparten ciclicamente (i % cantidad) entre las 26
// posiciones fijas que la escena ya reserva, igual que antes hacian los
// emojis, asi que menos fotos simplemente se repiten mas seguido sin que la
// escena se vea mas vacia.
const fotosBase=(Array.isArray(CONFIG.fotos)&&CONFIG.fotos.length)?CONFIG.fotos:DEFAULTS.fotos;
function makePhotoSprite(url,size){
  const c=document.createElement('canvas');c.width=c.height=256;
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(size,size,1);
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    // "contain": la foto entra completa sin recortar ningun borde (lo que
    // sobra en el lienzo cuadrado queda transparente); el sprite se encoge
    // en el eje sobrante para que no se note como un marco cuadrado vacio.
    const s=Math.min(c.width/img.width,c.height/img.height);
    ctx.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s);
    tex.needsUpdate=true;
    const aspect=img.naturalWidth/img.naturalHeight;
    const aX=Math.min(1,aspect),aY=Math.min(1,1/aspect);
    sp.scale.set(size*aX,size*aY,1);
  };
  img.onerror=()=>{};
  img.src=url;
  return sp;
}
const photoGroup=new THREE.Group();scene.add(photoGroup);
const PHOTO_COUNT=26;
for(let i=0;i<PHOTO_COUNT;i++){
  const url=fotosBase[i%fotosBase.length];
  const size=28+Math.random()*20;
  const sp=makePhotoSprite(url,size);
  const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
  const r=140+Math.random()*170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
  sp.userData={phi:phi,theta:theta,radius:r,speed:0.0006+Math.random()*0.0012};
  photoGroup.add(sp);
}

// Controles cámara — dirección corregida: ahora sigue el lado hacia donde deslizas
let dragging=false,lastX=0,lastY=0;
function onDown(e){dragging=true;const t=e.touches?e.touches[0]:e;lastX=t.clientX;lastY=t.clientY;}
function onMove(e){if(!dragging)return;const t=e.touches?e.touches[0]:e;const dx=(t.clientX-lastX)/innerWidth;const dy=(t.clientY-lastY)/innerHeight;rotY-=dx*5;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*3.5));lastX=t.clientX;lastY=t.clientY;}
function onUp(){dragging=false;}
addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
addEventListener('touchstart',onDown,{passive:true});addEventListener('touchmove',onMove,{passive:true});addEventListener('touchend',onUp,{passive:true});
addEventListener('wheel',(e)=>{targetDist+=e.deltaY*0.25;targetDist=Math.max(160,Math.min(600,targetDist));},{passive:true});

// Zoom con pellizco en móviles
let pinch=0;
addEventListener('touchmove',(e)=>{
  if(e.touches && e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    if(pinch){targetDist+=(pinch-d)*0.5;targetDist=Math.max(160,Math.min(600,targetDist));}
    pinch=d;
  }
},{passive:false});
addEventListener('touchend',()=>{pinch=0;},{passive:true});

// Animación
let t=0;
function tick(){requestAnimationFrame(tick);t+=0.01;
  updateMemory();
  const memoryPulse=1+Math.sin(t*3.15)*.055;
  memorySprite.scale.set(MEMORY_BASE_SIZE*memoryPulse,MEMORY_BASE_SIZE*memoryPulse,1);
  // El girasol orbita con suavidad, manteniendo su centro siempre visible.
  flowerCrown.rotation.z+=0.00035;
  flowerCrown.rotation.y=Math.sin(t*.25)*.055;
  flowerCrown.rotation.x=Math.sin(t*.34)*.045;
  flowerCrown.position.y=Math.sin(t*.52)*2.5;
  // El carrusel se alinea con el núcleo de la nebulosa sin quedar oculto
  // por su profundidad ni por el agujero negro.
  memorySprite.position.copy(flowerCrown.position);
  core.position.copy(flowerCrown.position);
  const sunflowerBeat=1+Math.sin(t*1.7)*.018;
  flowerCrown.scale.set(sunflowerBeat,sunflowerBeat,sunflowerBeat);
  flowerCrown.children.forEach(flower=>{
    const pulse=1+Math.sin(t*1.8+flower.userData.phase)*.04;
    flower.scale.set(flower.userData.size*pulse,flower.userData.size*pulse,1);
  });
  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03),GLOW_BASE*(1+Math.sin(t*0.4)*0.03),1);
  const s=1.0+0.05*Math.sin(t*3); // latido
  core.scale.set(s,s,s);
  textGroup.children.forEach(sp=>{
    sp.material.opacity=0.8+0.2*Math.sin(t*2);
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(sp=>{
    sp.material.opacity=0.85+0.15*Math.sin(t*2+sp.userData.radius);
    // Sin rotacion propia: a diferencia de un emoji (simetrico, giraba bien
    // como si fuera un pinwheel), una foto real con forma reconocible se ve
    // rara/como "estirada" al girar sobre su propio eje en ciertos angulos -
    // se quita, la foto solo orbita y flota, se queda siempre derecha.
    sp.userData.theta+=sp.userData.speed;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  currentDist+=(targetDist-currentDist)*0.06;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();

// ── Arranque: inicia la secuencia de recuerdos, siempre sin sonido ──
const startScreen=document.getElementById('start-screen');
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>startScreen.style.display='none',800);
  if(!experienceStarted){experienceStarted=true;setMemory(0);}
}
startScreen.addEventListener('click',startExperience);
</script>
